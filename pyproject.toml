[project]
name = "voice"
version = "0.1.0"
description = "Hold the launch key and speak; the text goes into the focused field."
requires-python = ">=3.13"
license = "0BSD"
dependencies = [
    "numpy==2.4.6",
    "sherpa-onnx==2.0.1",
]

[project.scripts]
voice = "voice.__main__:entry"

[dependency-groups]
dev = ["pytest==9.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
